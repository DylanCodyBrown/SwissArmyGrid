<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SwissArmyGrid notebook</title>
    <!-- The icon inline (a red square with a white cross), so the browser never requests
         /favicon.ico, which would need the token. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23D52B1E'/%3E%3Cpath fill='%23fff' d='M42 23h16v19h19v16H58v19H42V58H23V42h19z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/grid.css" />
    <link rel="stylesheet" href="/static/catalog.css" />
  </head>
  <body class="catalog-page notebook-page">
    <!-- The notebook, always in a tab of its own (plan decision 12): blades and the catalog on the
         left, marimo on the right (served through SAG at /marimo, so this page can see drops and
         the highlighted code). -->
    <header class="cat-top">
      <h1>Notebook</h1>
      <div class="row-actions nb-tools" role="toolbar" aria-label="Notebook tools"></div>
      <span class="cat-live" aria-live="polite"></span>
    </header>
    <div class="cat-layout">
      <aside class="cat-rail" aria-label="Blades and catalog">
        <section class="rail-section" id="blades" aria-labelledby="blades-title"></section>
        <section class="rail-section grow" id="catalog" aria-labelledby="catalog-title"></section>
      </aside>
      <main class="nb-main">
        <iframe class="nb-frame" title="marimo notebook" hidden></iframe>
        <div class="nb-status" role="status">Starting the notebook...</div>
      </main>
    </div>
    <script type="module" src="/static/build/notebook.js"></script>
  </body>
</html>
