<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>Workbench</title>
    <!-- The icon inline, so the browser never requests /favicon.ico (which would need the token). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23D52B1E'/%3E%3Cpath fill='%23fff' d='M42 23h16v19h19v16H58v19H42V58H23V42h19z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/grid.css" />
    <link rel="stylesheet" href="/static/catalog.css" />
    <link rel="stylesheet" href="/static/build/workbench.css" />
  </head>
  <body class="catalog-page workbench-page">
    <!-- The Workbench (Plans/workbench-and-connections.plan.md): notebooks and scripts, always in a window
         of their own, opened from the grid page's Workbench tab. The rail is the blades page's. -->
    <div class="wb-layout">
      <aside class="cat-rail" aria-label="Connections, blades and the data explorer">
        <section class="rail-section" id="blades" aria-labelledby="blades-title"></section>
        <section class="rail-section grow" id="catalog" aria-labelledby="catalog-title"></section>
      </aside>
      <main class="wb-main">
        <div class="wb-toolbar" id="wb-toolbar" role="toolbar" aria-label="Workbench"></div>
        <div class="wb-tabs" id="wb-tabs" role="tablist" aria-label="Open documents"></div>
        <div class="wb-body" id="wb-body"></div>
      </main>
    </div>
    <script type="module" src="/static/build/workbench.js"></script>
  </body>
</html>
